# Сборка и развёртывание Kvadrok (Defold, wasm-web) на self-hosted раннере.
#
# Триггер: push в ветку main (и ручной запуск через workflow_dispatch).
#
# Почему не docker build и не d.defold.com на каждом запуске
# ----------------------------------------------------------
# Прямое скачивание bob.jar (~230 МБ) с d.defold.com на этом хосте идёт
# десятки-сотни байт в секунду, и сборка падала по таймауту. Поэтому схема
# взята из проекта bumpy:
#   1. Образ-сборщик (JDK 25 + bob.jar + библиотеки X11/GL) собирается ОДИН РАЗ
#      вручную workflow build-bob-image.yml и публикуется в GitHub Container
#      Registry. Здесь он только скачивается (docker pull).
#   2. bob.jar внутри этого образа; движки wasm-web лежат внутри bob.jar,
#      поэтому во время сборки в сеть никто не ходит.
#   3. Собранный бандл кладётся в Docker-образ nginx (docker/Dockerfile) и
#      деплоится контейнером на Docker-демоне раннера.
#
# Job выполняется на self-hosted раннере, поэтому контейнер игры продолжает
# работать после завершения workflow (в отличие от эфемерных GitHub-hosted
# раннеров).

name: Build & Deploy (master)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Отменять предыдущий запуск при новом пуше.
concurrency:
  group: deploy-master
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: kvadrok-web
  IMAGE_TAG: latest
  CONTAINER_NAME: kvadrok-web
  HOST_PORT: "8098"
  # Ключ подписи APK (base64 от .keystore) и его пароль. Пусто — сборка
  # создаст временный ключ (APK установится, но обновления поверх не встанут).
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

jobs:
  build-and-deploy:
    name: Сборка образа и развёртывание на self-hosted
    # Self-hosted раннер (см. AGENTS.md). Требуется установленный Docker.
    runs-on: [self-hosted]
    timeout-minutes: 60

    steps:
      - name: Очистка root-owned остатков предыдущих сборок
        # bob в контейнере-сборщике пишет артефакты (.internal/, build/, dist/)
        # прямо в смонтированный workspace. Если контейнер работал под root, эти
        # каталоги остаются root-owned, и actions/checkout не может очистить
        # workspace (EACCES). Все они git-ignored и пересоздаются на этой же
        # сборке, поэтому удаляем их из контейнера под root ДО checkout.
        run: |
          set -euo pipefail
          found=""
          for d in .internal build dist; do
            [ -e "$d" ] && found="$found $d"
          done
          if [ -n "$found" ]; then
            echo "Найдены остатки:$found — удаляю через контейнер под root"
            docker run --rm -v "$PWD":/project alpine \
              sh -c 'rm -rf /project/.internal /project/build /project/dist'
          else
            echo "Остатков нет — пропускаю"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история: номер сборки = число коммитов (git rev-list --count HEAD).
          fetch-depth: 0

      - name: Определение имени образа-сборщика
        # ghcr.io требует имя в нижнем регистре.
        run: |
          set -euo pipefail
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "BOB_BUILDER_IMAGE=ghcr.io/${OWNER_LC}/kvadrok-bob-builder" >> "$GITHUB_ENV"

      - name: Определение версии Defold (sha1)
        id: defold
        run: |
          set -euo pipefail
          SHA1="$(curl -fsSL --max-time 60 https://d.defold.com/stable/info.json \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["sha1"])')"
          echo "sha1=${SHA1}" >> "$GITHUB_OUTPUT"
          echo "Defold stable sha1: ${SHA1}"

      - name: Логин в GitHub Container Registry
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Загрузка образа-сборщика из GitHub Container Registry
        # Образ (JDK 25 + bob.jar + X11/GL) публикуется workflow
        # build-bob-image.yml. Здесь только docker pull — ни docker build, ни
        # скачиваний с d.defold.com.
        run: |
          set -euo pipefail
          REMOTE="${BOB_BUILDER_IMAGE}:${{ steps.defold.outputs.sha1 }}"
          # Если образ для этой версии Defold ещё не опубликован (stable только
          # что обновилась), не валим деплой: используем локально собранный
          # образ kvadrok-bob-builder:25-jdk.
          if docker pull "${REMOTE}"; then
            echo "BOB_BUILDER_REF=${REMOTE}" >> "$GITHUB_ENV"
          elif docker image inspect "kvadrok-bob-builder:25-jdk" >/dev/null 2>&1; then
            echo "::warning::Образ ${REMOTE} не найден в ghcr.io — использую локальный kvadrok-bob-builder:25-jdk"
            echo "BOB_BUILDER_REF=kvadrok-bob-builder:25-jdk" >> "$GITHUB_ENV"
          else
            echo "::error::Образ ${REMOTE} недоступен, и локального kvadrok-bob-builder:25-jdk нет"
            echo "::error::Сначала запустите workflow build-bob-image.yml для этой версии Defold"
            exit 1
          fi

      - name: Сборка HTML5-бандла (wasm-web) в контейнере с JDK
        # --architectures wasm-web: собираем ТОЛЬКО однопоточный движок. Иначе
        # HTML5-бандлер дополнительно собирает wasm_pthread-web, а его движка в
        # bob.jar нет — bob качает его с d.defold.com, который здесь троттлится
        # и «зависает» на этапе Bundling. Игре потоки не нужны.
        #
        # Для HTML5 bob создаёт вложенную папку с именем проекта (title=kvadrok)
        # внутри --bundle-output, т.е. результат в dist/web/kvadrok/
        # (index.html, dmloader.js, *.wasm, archive/).
        run: |
          set -euxo pipefail
          rm -rf dist/web/kvadrok

          # Контейнер от имени пользователя раннера (не root): bob пишет кэш в
          # .internal/ в смонтированный workspace, и root-owned каталоги ломают
          # следующий checkout. HOME=/tmp — чтобы JDK не писал в $HOME.
          #
          # Логи bob пишем в файл и стримим через tail, рядом печатаем «пульс»
          # каждые 15 с: так видно, что процесс жив, а не завис.
          BOB_LOG=/tmp/bob-build.log
          BOB_START=$(date -u +%s)
          : > "$BOB_LOG"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD":/project \
            -w /project \
            "${BOB_BUILDER_REF}" \
            java -jar /opt/bob/bob.jar \
              --verbose \
              --root . \
              --platform wasm-web \
              --architectures wasm-web \
              --archive \
              --variant release \
              --bundle-output dist/web \
              resolve build bundle >"$BOB_LOG" 2>&1 &
          BOB_PID=$!

          tail -n +1 -f "$BOB_LOG" &
          TAIL_PID=$!

          while kill -0 "$BOB_PID" 2>/dev/null; do
            sleep 15
            echo "[$(date -u +%H:%M:%S)] bob ещё работает уже $(( $(date -u +%s) - BOB_START )) с (строк лога: $(wc -l < "$BOB_LOG"))"
          done

          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true

          rc=0
          wait "$BOB_PID" || rc=$?
          echo "::group::Последние 80 строк лога bob (код выхода: $rc)"
          tail -n 80 "$BOB_LOG"
          echo "::endgroup::"
          [ "$rc" -eq 0 ] || { echo "bob завершился с кодом $rc"; exit "$rc"; }

          test -f dist/web/kvadrok/index.html
          ls -la dist/web/kvadrok

      - name: Сборка APK для Android (arm64) и вложение в web-бандл
        # Игра распространяется и как веб-страница, и как APK: на Android
        # страница предлагает скачать дистрибутив (см. шаг правки index.html),
        # а сам файл отдаётся nginx по пути download/kvadrok.apk.
        #
        # Почему только --architectures arm64-android и --platform arm64-android:
        # в bob.jar движок Android есть ТОЛЬКО для arm64 (libexec/arm64-android/
        # libdmengine_release.so). Для armv7/x86_64 движков нет, и bob пытается
        # скачать их с d.defold.com, который на этом хосте троттлится — сборка
        # «зависает» на этапе Bundling. arm64 покрывает все актуальные Android-
        # устройства.
        #
        # Ключ подписи обязателен и должен быть ОДНИМ И ТЕМ ЖЕ между релизами:
        # Android отказывается устанавливать обновление APK, подписанное другим
        # ключом. Ключ берётся из секретов репозитория (base64 от .keystore),
        # bob ждёт ПАРОЛЬ В ФАЙЛЕ (--keystore-pass/--key-pass — это пути к
        # файлам с паролем, а не сам пароль).
        run: |
          set -euo pipefail

          KS_DIR=docker/android
          KS_FILE="$KS_DIR/kvadrok.keystore"
          PASS_FILE="$KS_DIR/kvadrok.pass"
          mkdir -p "$KS_DIR"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Ключ подписи: из секрета ANDROID_KEYSTORE_BASE64"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$KS_FILE"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — создаю временный ключ."
            echo "::warning::При смене ключа Android не установит APK поверх предыдущей версии."
            docker run --rm -v "$PWD/$KS_DIR":/out "${BOB_BUILDER_REF}" \
              keytool -genkeypair -v -keystore /out/kvadrok.keystore \
                -alias kvadrok -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "${ANDROID_KEYSTORE_PASSWORD:-kvadrokpass}" \
                -keypass "${ANDROID_KEYSTORE_PASSWORD:-kvadrokpass}" \
                -dname "CN=Kvadrok, OU=Game, O=Kvadrok, L=Unknown, ST=Unknown, C=RU"
          fi
          chmod 600 "$KS_FILE"
          printf '%s' "${ANDROID_KEYSTORE_PASSWORD:-kvadrokpass}" > "$PASS_FILE"

          rm -rf dist/android
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD":/project \
            -w /project \
            "${BOB_BUILDER_REF}" \
            java -jar /opt/bob/bob.jar \
              --root . \
              --platform arm64-android \
              --architectures arm64-android \
              --variant release \
              --bundle-output dist/android \
              --keystore "$KS_FILE" \
              --keystore-pass "$PASS_FILE" \
              --keystore-alias kvadrok \
              --key-pass "$PASS_FILE" \
              resolve build bundle

          test -f dist/android/kvadrok/kvadrok.apk
          mkdir -p dist/web/kvadrok/download
          cp dist/android/kvadrok/kvadrok.apk dist/web/kvadrok/download/kvadrok.apk
          ls -lh dist/web/kvadrok/download/kvadrok.apk

      - name: Подстановка версии игры в index.html
        # Рядом с бейджем «Made with Defold» показываем версию игры и номер
        # сборки:
        #   * версия игры — [project] version из game.project (semver, источник
        #     истины, меняется вручную при релизе);
        #   * номер сборки — число коммитов в текущей истории
        #     (git rev-list --count HEAD), растёт на каждом деплое; для этого
        #     checkout идёт с fetch-depth: 0.
        # Итоговый вид: «Made with Defold — v1.0 (build 123)».
        # index.html — сгенерированный Defold-шаблон; правка безопасна:
        # dmloader.js сверяет sha1/size только wasm и архива, а не самого html.
        run: |
          set -euo pipefail
          GAME_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' game.project | head -n1 | tr -d '[:space:]')"
          if [ -z "${GAME_VERSION}" ]; then
            echo "Не удалось прочитать version из game.project" >&2
            exit 1
          fi
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          BUILD_LABEL="v${GAME_VERSION} (build ${BUILD_NUMBER})"
          echo "Версия игры: ${BUILD_LABEL}"

          INDEX=dist/web/kvadrok/index.html
          GAME_VERSION="${GAME_VERSION}" BUILD_LABEL="${BUILD_LABEL}" python3 - "$INDEX" <<'PY'
          import os, sys

          index = sys.argv[1]
          with open(index, encoding="utf-8") as f:
              html = f.read()

          badge = '<div class="link">Made with <a href="https://defold.com/" target="_blank">Defold</a></div>'
          if badge not in html:
              sys.exit(f"В {index} не найден бейдж «Made with Defold» — нечего дополнить")

          version = os.environ["GAME_VERSION"]
          label = os.environ["BUILD_LABEL"]
          replacement = (
              '<div class="link">Made with '
              '<a href="https://defold.com/" target="_blank">Defold</a>'
              f' <span class="build-version" title="Версия игры">&#8212; {label}</span></div>'
          )
          html = html.replace(badge, replacement, 1)

          html = html.replace(f"<title>kvadrok {version}</title>",
                              f"<title>kvadrok {label}</title>", 1)

          # Маленькая ссылка «скачать для Android» внизу экрана — в том же ряду
          # кнопок, что Fullscreen и «Made with Defold». Атрибут download
          # заставляет браузер сохранять файл, а не открывать его.
          android_link = (
              '<a class="android-download" href="download/kvadrok.apk" '
              'download="kvadrok.apk" title="Скачать игру для Android">'
              'скачать для Android</a>'
          )
          buttons = '<div class="button" onclick="Module.toggleFullscreen();">Fullscreen</div>'
          if buttons not in html:
              sys.exit(f"В {index} не найден блок кнопок для ссылки на Android")
          html = html.replace(buttons, buttons + "\n\t\t\t" + android_link, 1)

          # Плашка-предложение установить приложение. Скрыта по умолчанию;
          # показывается скриптом при заходе с Android-устройства.
          prompt = (
              '<div id="android-install-prompt" class="android-prompt" style="display:none">'
              '<span>Игра доступна как приложение для Android</span>'
              '<a href="download/kvadrok.apk" download="kvadrok.apk">Установить</a>'
              '<button type="button" class="android-prompt-close" '
              'id="android-install-close" aria-label="Закрыть">&times;</button>'
              '</div>'
          )
          html = html.replace(
              '<div id="app-container" class="canvas-app-container">',
              prompt + '\n\t<div id="app-container" class="canvas-app-container">', 1)

          # Стили — перед закрывающим тегом стилей. Строки склеиваются из
          # отдельных литералов: многострочные """...""" внутри блока run: |
          # ломают YAML (их строки не выровнены под отступ шага).
          styles = (
              "\n"
              "\t.android-download { font-size: 12px; margin-left: 12px; opacity: 0.8; }\n"
              "\t.android-download:hover { opacity: 1; }\n"
              "\t.android-prompt { position: fixed; left: 0; right: 0; bottom: 0;"
              " z-index: 10; display: none; align-items: center; gap: 8px;"
              " padding: 8px 12px; background: #1a72eb; color: #fff;"
              " font-family: sans-serif; font-size: 13px; }\n"
              "\t.android-prompt a { margin-left: auto; background: #fff;"
              " color: #006fff; border-radius: 4px; padding: 4px 10px;"
              " font-weight: 600; }\n"
              "\t.android-prompt-close { background: none; border: 0; color: #fff;"
              " font-size: 20px; line-height: 1; cursor: pointer; }\n"
          )
          html = html.replace("\n\t</style>", styles + "\t</style>", 1)

          # Скрипт показа плашки на Android и закрытия по крестику. Факт
          # закрытия запоминается в localStorage, чтобы не предлагать установку
          # при каждом заходе (например, когда приложение уже установлено).
          script = (
              "<script>\n"
              "\t(function () {\n"
              '\t\tvar KEY = "kvadrok_android_prompt_dismissed";\n'
              '\t\tvar prompt = document.getElementById("android-install-prompt");\n'
              "\t\tif (!prompt) return;\n"
              "\t\tif (!/Android/i.test(navigator.userAgent)) return;\n"
              "\t\tvar dismissed = false;\n"
              '\t\ttry { dismissed = localStorage.getItem(KEY) === "1"; } catch (e) {}\n'
              "\t\tif (dismissed) return;\n"
              '\t\tprompt.style.display = "flex";\n'
              '\t\tvar close = document.getElementById("android-install-close");\n'
              "\t\tif (close) {\n"
              '\t\t\tclose.addEventListener("click", function () {\n'
              '\t\t\t\tprompt.style.display = "none";\n'
              '\t\t\t\ttry { localStorage.setItem(KEY, "1"); } catch (e) {}\n'
              "\t\t\t});\n"
              "\t\t}\n"
              "\t})();\n"
              "</script>\n"
          )
          html = html.replace("</body>", script + "</body>", 1)

          with open(index, "w", encoding="utf-8") as f:
              f.write(html)
          print("index.html обновлён")
          PY

          grep -o 'build-version[^<]*</span>' "$INDEX" || true
          grep -o 'android-download[^>]*>[^<]*' "$INDEX" || true

      - name: Остановка и удаление старого контейнера
        run: |
          set -euo pipefail
          if ! docker ps -a --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
            echo "Контейнер ${CONTAINER_NAME} не найден — пропускаю"
            exit 0
          fi
          if docker ps --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
            echo "Останавливаю запущенный контейнер ${CONTAINER_NAME}"
            docker stop "${CONTAINER_NAME}"
          fi
          echo "Удаляю контейнер ${CONTAINER_NAME}"
          docker rm "${CONTAINER_NAME}"

      - name: Сборка Docker-образа игры (nginx + бандл)
        run: |
          set -euo pipefail
          docker build \
            -f docker/Dockerfile \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            .
          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format 'Образ игры собран: {{.RepoTags}} ({{.Size}} байт)'

      - name: Развёртывание контейнера игры
        # `docker` здесь — Docker-демон self-hosted раннера (реальная машина),
        # поэтому контейнер остаётся работать после завершения workflow.
        run: |
          set -euo pipefail
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p "${HOST_PORT}:80" \
            --restart unless-stopped \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Проверка доступности (health check)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:${HOST_PORT}/"; then
              echo "Сервис отвечает на http://localhost:${HOST_PORT}/"
              break
            fi
            echo "Ожидание запуска nginx... (${i}/30)"
            sleep 2
          done
          curl -fsS -o /dev/null -w "Игра: HTTP %{http_code}\n" "http://localhost:${HOST_PORT}/"
          # WASM обязан отдаваться с правильным MIME, иначе браузер не запустит
          # движок. Проверяем заголовок.
          curl -fsS -o /dev/null -D - "http://localhost:${HOST_PORT}/kvadrok.wasm" \
            | grep -i "^content-type" \
            | grep -qi "application/wasm" \
            && echo "MIME .wasm: application/wasm — ок" \
            || { echo "::error::.wasm отдаётся с неверным MIME"; exit 1; }
          docker ps --filter "name=${CONTAINER_NAME}"

      - name: Диагностика при ошибке
        if: failure()
        run: |
          docker ps -a || true
          docker logs "${CONTAINER_NAME}" || true
