worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WASM обязателен: без него браузер не запустит движок (MIME-проверка
    # при WebAssembly.instantiateStreaming).
    types {
        application/wasm wasm;
        application/javascript js;
        application/vnd.android.package-archive apk;
    }

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # .wasm и .arcd сжимать бессмысленно (уже сжаты), а .js/.html — полезно.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Кэширование статики движка: имена файлов не меняются, но при релизе
        # бандл пересоздаётся, поэтому даём короткий TTL и revalidate.
        location ~* \.(wasm|js|arci|arcd|dmanifest|projectc)$ {
            add_header Cache-Control "public, max-age=300, must-revalidate";
            try_files $uri =404;
        }

        # Дистрибутив для Android. Отдаём как вложение с правильным MIME, чтобы
        # браузер скачивал APK, а не пытался показать его текстом. Кэш отключён:
        # по одному и тому же адресу лежит новая сборка после каждого релиза.
        location = /download/kvadrok.apk {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Content-Disposition 'attachment; filename="kvadrok.apk"';
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
